spring.application.name=ibismaker3d-back

# --- Base de datos H2 en memoria (desarrollo) ---
spring.datasource.url=jdbc:h2:mem:ibismaker3d;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Carga datos de ejemplo (data.sql) despues de crear el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

