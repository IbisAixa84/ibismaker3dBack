spring.application.name=ibismaker3d-back

# --- Base de datos H2 en memoria (desarrollo) ---
#spring.datasource.url=jdbc:h2:mem:ibismaker3d;DB_CLOSE_DELAY=-1
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 en http://localhost:8080/h2-console
#spring.h2.console.enabled=true

# Carga datos de ejemplo (data.sql) despues de crear el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# --- Configuracion para PostgreSQL (produccion) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/ibismaker3d
# spring.datasource.username=postgres
# spring.datasource.password=changeme
# spring.jpa.hibernate.ddl-auto=validate

spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
# --- Configuracion para AzureSQL (produccion) ---
spring.datasource.url=jdbc:sqlserver://ibismaker3dserver.database.windows.net:1433;database=IBISMAKER3D;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=ibismaker3dsql
spring.datasource.password=${DB_PASSWORD}
#spring.jpa.hibernate.ddl-auto=validate
